services:
  - type: web
    name: shopify-sidekick-app-sample
    runtime: node
    plan: starter
    buildCommand: pnpm install --prod=false && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /healthz
    disk:
      name: company-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/company.sqlite
      - key: SHOPIFY_API_VERSION
        value: 2026-10
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
